name: Traffic Badge

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch traffic (last 14d)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" ^
            https://api.github.com/repos/${{ github.repository }}/traffic/views > traffic.json
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate badge SVG
        run: |
          python - << "PY"
          import json, pathlib
          p = pathlib.Path("traffic.json")
          if not p.exists(): raise SystemExit("traffic.json missing")
          print(p.read_text()[:200])
          PY
          python scripts/traffic_badge.py traffic.json assets/badges/visits.svg
      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/badges/visits.svg
          git commit -m "chore: update visits badge" || echo "No changes"
          git push