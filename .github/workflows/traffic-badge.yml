name: Traffic Badge

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
      - name: Fetch traffic (last 14d)
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer ${TRAFFIC_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/traffic/views" > traffic.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Saved traffic.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate badge SVG
        shell: pwsh
        run: |
          if (!(Test-Path traffic.json)) { throw "traffic.json missing" }
          python scripts/traffic_badge.py traffic.json assets/badges/visits.svg

      - name: Commit badge
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/badges/visits.svg
          git commit -m "chore: update visits badge" || echo "No changes"
          git push