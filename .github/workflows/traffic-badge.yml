name: Traffic Badge

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch traffic (last 14d)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $url = "https://api.github.com/repos/${{ github.repository }}/traffic/views"
          $resp = Invoke-WebRequest -Headers $headers -Uri $url -UseBasicParsing -TimeoutSec 60
          if ($resp.StatusCode -ne 200) {
            Write-Host "HTTP $($resp.StatusCode)"; Write-Host $resp.Content; exit 1
          }
          $resp.Content | Out-File -FilePath traffic.json -Encoding UTF8
          Write-Host "Saved traffic.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate badge SVG
        shell: pwsh
        run: |
          if (!(Test-Path traffic.json)) { throw "traffic.json missing" }
          python scripts/traffic_badge.py traffic.json assets/badges/visits.svg

      - name: Commit badge
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/badges/visits.svg
          git commit -m "chore: update visits badge" || echo "No changes"
          git push