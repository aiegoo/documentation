
<!-- this handles the automatic toc. use ## for subheads to auto-generate the on-page minitoc. if you use html tags, you must supply an ID for the heading element in order for it to appear in the minitoc. -->
<script>
$( document ).ready(function() {
  if (typeof window.$ === 'undefined' || !$.fn || typeof $.fn.toc !== 'function') {
    console.warn('TOC plugin is unavailable; skipping table of contents rendering.');
    return;
  }

  $('#toc').toc({ minimumHeaders: 0, listType: 'ul', showSpeed: 0, headers: 'h2,h3' });

  /* this offset helps account for the space taken up by the floating toolbar. */
  $('#toc').on('click', 'a', function() {
    var target = $(this.getAttribute('href'))
      , scroll_target = target.offset().top

    $(window).scrollTop(scroll_target - 10);
    return false
  })

});
</script>
<div class="col-md-3" style="margin-left: 600px; max-width: 400px; position: relative;">
<details open style="position: fixed; top: 35px; right: 0;">
  <summary>
    <div id="toc" class="toc">
    </div></summary>
</details>
</div>
